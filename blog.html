<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#050609">
<meta name="description" content="Travel photos, videos and trip memories by Lakindu Sathsara.">
<link rel="canonical" href="https://www.apokolips.xyz/blog.html">
<title>Travel Blog | Apokolips</title>
<link rel="icon" href="file_00000000a7ec820890154ca6ed49b608.ico">
<link rel="stylesheet" href="./style.css">
<link rel="stylesheet" href="./blog-app/src/blog.css">
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@19.1.0",
    "react-dom/client": "https://esm.sh/react-dom@19.1.0/client?external=react",
    "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@2.119.0"
  }
}
</script>
</head>
<body>
<div class="mechanical-intro" id="blogMechanicalIntro" role="status" aria-label="Apokolips blog is loading">
  <div class="intro-grid"></div><div class="intro-corner intro-corner-tl"></div><div class="intro-corner intro-corner-br"></div>
  <div class="intro-machine">
    <div class="intro-orbit intro-orbit-one"></div><div class="intro-orbit intro-orbit-two"></div>
    <div class="intro-gear intro-gear-large"><span></span><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
    <div class="intro-gear intro-gear-small"><span></span><i></i><i></i><i></i><i></i></div>
    <div class="intro-arm intro-arm-top"><i></i><b></b></div><div class="intro-arm intro-arm-right"><i></i><b></b></div>
    <div class="intro-arm intro-arm-bottom"><i></i><b></b></div><div class="intro-arm intro-arm-left"><i></i><b></b></div>
    <div class="intro-core"><img src="https://raw.githubusercontent.com/lakindusathsara44-bit/Apokolips/main/file_00000000a7ec820890154ca6ed49b608.png" alt="Apokolips icon"><span></span></div><div class="intro-scanline"></div>
  </div>
  <div class="intro-brand">APOKOLIPS</div><div class="intro-subtitle">BLOG SYSTEMS · ONLINE</div>
  <div class="intro-progress"><span id="blogIntroProgress" style="width:12%"></span></div>
  <div class="intro-status"><span id="blogIntroStatus">LOADING RESOURCES</span><strong id="blogIntroPercent">12%</strong></div>
</div>
<script>
(() => {
  const startedAt = performance.now();
  const loader = document.getElementById('blogMechanicalIntro');
  const bar = document.getElementById('blogIntroProgress');
  const status = document.getElementById('blogIntroStatus');
  const percent = document.getElementById('blogIntroPercent');
  if (!loader) return;
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) { loader.remove(); return; }
  let complete = false;
  const finish = () => {
    if (complete) return;
    complete = true;
    bar.style.width = '100%';
    status.textContent = 'SYSTEM READY';
    percent.textContent = '100%';
    window.setTimeout(() => {
      loader.classList.add('is-exiting');
      window.setTimeout(() => loader.remove(), 500);
    }, Math.max(0, 7500 - (performance.now() - startedAt)));
  };
  if (document.readyState === 'complete') finish();
  else window.addEventListener('load', finish, { once: true });
})();
</script>
<div id="blog-root"></div>
<script type="module" src="./blog-app/src/main.js"></script>
</body>
</html>
