name: Notify Apokolips Blog readers about new photos

on:
  push:
    branches: [main]
    paths:
      - 'blog.html'

permissions:
  contents: read

jobs:
  notify-readers:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect newly published blog photos
        id: detect
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${BEFORE_SHA}" =~ ^0+$ ]]; then
            echo "Initial commit detected; skipping historical photo notifications."
            exit 0
          fi
          git show "${BEFORE_SHA}:blog.html" > /tmp/old-blog.html 2>/dev/null || true
          git show "${AFTER_SHA}:blog.html" > /tmp/new-blog.html
          node > /tmp/new-blog-photos.txt <<'NODE'
          const fs = require("fs");
          const imagePattern = /\.(?:jpe?g|png|webp|gif)(?:[?#].*)?$/i;
          const extract = (html) => {
            const found = new Set();
            for (const match of html.matchAll(/<img\b[^>]*\bsrc\s*=\s*["']([^"']+)["']/gi)) {
              const src = match[1].trim();
              if (imagePattern.test(src)) found.add(src);
            }
            return found;
          };
          const before = extract(fs.readFileSync("/tmp/old-blog.html", "utf8"));
          const after = extract(fs.readFileSync("/tmp/new-blog.html", "utf8"));
          for (const src of after) if (!before.has(src)) console.log(src);
          NODE
          if [[ ! -s /tmp/new-blog-photos.txt ]]; then
            echo "has_new_photos=false" >> "$GITHUB_OUTPUT"
            echo "No newly referenced blog photos found."
            exit 0
          fi
          echo "has_new_photos=true" >> "$GITHUB_OUTPUT"

      - name: Notify previous blog commenters about each new photo
        if: steps.detect.outputs.has_new_photos == 'true'
        env:
          SUPABASE_FUNCTION_URL: ${{ secrets.APOKOLIPS_BLOG_PUSH_FUNCTION_URL }}
          WEBHOOK_SECRET: ${{ secrets.APOKOLIPS_BLOG_WEBHOOK_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${SUPABASE_FUNCTION_URL}" || -z "${WEBHOOK_SECRET}" ]]; then
            echo "Missing APOKOLIPS_BLOG_PUSH_FUNCTION_URL or APOKOLIPS_BLOG_WEBHOOK_SECRET repository secret."
            exit 1
          fi
          while IFS= read -r image_src; do
            [[ -z "${image_src}" ]] && continue
            payload=$(jq -n --arg src "${image_src}" '{event:"media_added",file_path:$src}')
            curl --fail-with-body --silent --show-error \
              -X POST "${SUPABASE_FUNCTION_URL}" \
              -H "Content-Type: application/json" \
              -H "x-blog-webhook-secret: ${WEBHOOK_SECRET}" \
              --data "${payload}"
            echo "Queued new blog photo notification for ${image_src}"
          done < /tmp/new-blog-photos.txt
