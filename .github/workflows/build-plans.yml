name: Build Apokolips React + Vite pages

on:
  push:
    branches:
      - main
    paths:
      - 'index.html'
      - 'plans.html'
      - 'index-app/**'
      - 'dev.html'
      - 'dev-app/**'
      - 'sales-app/**'
      - 'sales.html'
      - '404.html'
      - 'vite.sales.config.js'
      - 'supabase/migrations/**'
      - 'vite.dev.config.js'
      - 'docs/website-builder-routing.md'
      - 'package.json'
      - 'vite.index.config.js'
      - '.github/workflows/build-plans.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'index.html'
      - 'plans.html'
      - 'index-app/**'
      - 'dev.html'
      - 'dev-app/**'
      - 'sales-app/**'
      - 'sales.html'
      - '404.html'
      - 'vite.sales.config.js'
      - 'supabase/migrations/**'
      - 'vite.dev.config.js'
      - 'docs/website-builder-routing.md'
      - 'docs/dev-phase1-supabase.md'
      - 'package.json'
      - 'vite.index.config.js'
      - '.github/workflows/build-plans.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apokolips-react-vite-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build all React pages
        run: npm run build

      - name: Verify generated entry points and bundles
        run: |
          test -s index.html
          grep -q 'assets/index-app/' index.html
          test -s dev.html
          test -s assets/dev/dev.js
          test -s assets/dev/dev.css
          test -s sales.html
          test -s 404.html
          test -s assets/sales/sales.js
          test -s assets/sales/sales.css
          test -s plans.html
          grep -q 'https://www.apokolips.xyz/' plans.html
          test ! -d plans-app
          test ! -d assets/plans
          find assets/index-app -type f -size +0c | grep -q .
          echo "Verified Index, Dev and Sales React bundles; retired Plans route redirects to the Apokolips homepage."

      - name: Commit generated production files
        if: github.event_name == 'push'
        run: |
          git add -f index.html dev.html assets/index-app assets/dev/dev.js assets/dev/dev.css sales.html 404.html assets/sales/sales.js assets/sales/sales.css
          git add -u
          if git diff --cached --quiet; then
            echo "Generated production files are already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Build Apokolips React Vite production pages"
          git push origin HEAD:main
