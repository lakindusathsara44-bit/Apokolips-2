name: Build Apokolips React + Vite pages

on:
  push:
    branches:
      - main
    paths:
      - 'index.html'
      - 'index-app/**'
      - 'plans.html'
      - 'plans-app/**'
      - 'dev.html'
      - 'dev-app/**'
      - 'vite.dev.config.js'
      - 'docs/website-builder-routing.md'
      - 'package.json'
      - 'vite.config.js'
      - 'vite.index.config.js'
      - '.github/workflows/build-plans.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'index.html'
      - 'index-app/**'
      - 'plans.html'
      - 'plans-app/**'
      - 'dev.html'
      - 'dev-app/**'
      - 'vite.dev.config.js'
      - 'docs/website-builder-routing.md'
      - 'docs/dev-phase1-supabase.md'
      - 'package.json'
      - 'vite.config.js'
      - 'vite.index.config.js'
      - '.github/workflows/build-plans.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apokolips-react-vite-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build all React pages
        run: npm run build

      - name: Verify generated entry points and bundles
        run: |
          test -s index.html
          grep -q 'assets/index-app/' index.html
          test -s assets/plans/plans.js
          test -s assets/plans/plans.css
          test -s dev.html
          test -s assets/dev/dev.js
          test -s assets/dev/dev.css
          find assets/index-app -type f -size +0c | grep -q .
          echo "Verified Index, Plans and Dev React bundles."

      - name: Commit generated production files
        if: github.event_name == 'push'
        run: |
          git add -f index.html dev.html assets/index-app assets/plans/plans.js assets/plans/plans.css assets/dev/dev.js assets/dev/dev.css
          if git diff --cached --quiet; then
            echo "Generated production files are already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Build React Vite production pages"
          git push origin HEAD:main
