name: Build Apokolips Plans (Vite)

on:
  push:
    branches:
      - main
    paths:
      - 'plans.html'
      - 'plans-app/**'
      - 'package.json'
      - 'vite.config.js'
      - '.github/workflows/build-plans.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'plans.html'
      - 'plans-app/**'
      - 'package.json'
      - 'vite.config.js'
      - '.github/workflows/build-plans.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apokolips-plans-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build React + Vite assets
        run: npm run build

      - name: Verify generated files
        run: |
          test -s assets/plans/plans.js
          test -s assets/plans/plans.css
          echo "Verified plans.js and plans.css"

      - name: Commit generated assets
        if: github.event_name == 'push'
        run: |
          git add -f assets/plans/plans.js assets/plans/plans.css
          if git diff --cached --quiet; then
            echo "Generated plans assets are already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Build React Vite plans assets"
          git push origin HEAD:main
