name: Build Apokolips Community (React + Vite)

on:
  push:
    branches:
      - main
    paths:
      - 'Community.chat.html'
      - 'community-app/**'
      - 'package.json'
      - '.github/workflows/build-community.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'Community.chat.html'
      - 'community-app/**'
      - 'package.json'
      - '.github/workflows/build-community.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apokolips-community-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Create a reproducible dependency lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Install pinned dependencies
        run: npm ci --no-audit --no-fund

      - name: Build and type-check the community app
        run: npm run build:community

      - name: Verify generated output
        run: |
          test -s Community.chat.html
          test -s assets/community/community.js
          test -s assets/community/community.css
          grep -q 'assets/community/community.js' Community.chat.html
          echo "Verified Community.chat.html and both bundled assets."

      - name: Commit generated output on main
        if: github.event_name == 'push'
        run: |
          git add -f Community.chat.html assets/community package-lock.json
          if git diff --cached --quiet; then
            echo "Community output is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Build Apokolips Community assets"
          git push origin HEAD:main
