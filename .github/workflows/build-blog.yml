name: Build Apokolips Blog (React + Vite)

on:
  push:
    branches: [main]
    paths:
      - 'blog-app/**'
      - 'vite.blog.config.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/build-blog.yml'
  pull_request:
    branches: [main]
    paths:
      - 'blog-app/**'
      - 'vite.blog.config.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/build-blog.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apokolips-blog-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build React + Vite blog
        run: npm run build:blog

      - name: Verify generated blog page and assets
        run: |
          test -s blog.html
          test -s assets/blog/blog.js
          test -s assets/blog/blog.css
          grep -q 'assets/blog/blog.js' blog.html
          echo "Verified React + Vite blog output."

      - name: Commit generated blog assets
        if: github.event_name == 'push'
        run: |
          git add -f blog.html assets/blog/
          if git diff --cached --quiet; then
            echo "Blog build output is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Build React Vite travel blog assets"
          git push origin HEAD:main
